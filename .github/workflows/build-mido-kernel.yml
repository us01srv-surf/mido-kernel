name: Build mido 4.9 NetHunter kernel (nRF52 BLE + RTL8192EU hotplug)

on:
  workflow_dispatch:
    inputs:
      commit:
        description: 'AlphaDroid mido kernel commit to build (default: alpha-14 HEAD)'
        required: false
        default: ''
  push:
    branches: [ main, master ]

env:
  # AlphaDroid's OWN kernel tree (their A15 ROM boots only with this base:
  # flashing a KudProject-lineage-17.1 build booted 21s then died in vold
  # FBE with reboot reason enablefilecrypto_failed — different 4.9.337 vs
  # 4.9.237 backports). Built with clang r510928 per their BoardConfig.
  KERNEL_REPO: AlphaDroid-devices/kernel_xiaomi_mido
  KERNEL_BRANCH: alpha-14
  DEFCONFIG: mido_defconfig
  ZIP_NAME: Black-Hydra-Serp3n7-mido-4.9-nrf52-rtl8192eu.zip

jobs:
  build:
    # NOTE: ubuntu-20.04 was retired by GitHub (April 2025) — jobs on that label
    # queue forever with no runner. 22.04 ships clang 14 (= their r510928 era)
    # plus aarch64/armhf GCC for binutils (as/ld) and the compat vDSO.
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout kit (AnyKernel3 + firmware blob + patches)
        uses: actions/checkout@v4

      - name: Checkout AlphaDroid mido 4.9 kernel @ alpha-14
        uses: actions/checkout@v4
        with:
          repository: ${{ env.KERNEL_REPO }}
          ref: ${{ github.event.inputs.commit || env.KERNEL_BRANCH }}
          path: kernel
          fetch-depth: 1

      - name: Restore AOSP clang cache
        uses: actions/cache@v4
        with:
          path: ~/aosp-clang
          key: aosp-clang-r510928

      - name: Install toolchain (AOSP clang r510928 + cross binutils)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            git make bc cpio kmod zip xz-utils file \
            gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu \
            gcc-arm-linux-gnueabihf binutils-arm-linux-gnueabihf \
            libc6-dev-arm64-cross libssl-dev flex bison libelf-dev elfutils \
            device-tree-compiler
          # Exact production toolchain (their BoardConfig pins
          # TARGET_KERNEL_CLANG_VERSION := r510928).
          # googlesource intermittently serves 503 HTML pages — validate the
          # download is a real gzip >100MB and retry before extracting.
          if [ ! -x "$HOME/aosp-clang/bin/clang" ]; then
            mkdir -p "$HOME/aosp-clang"
            ok=0
            for i in 1 2 3 4 5 6; do
              curl -sL --retry 3 --max-time 600 -o /tmp/aosp-clang.tar.gz \
                "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/tags/android-14.0.0_r50/clang-r510928.tar.gz" || true
              sz=$(stat -c%s /tmp/aosp-clang.tar.gz 2>/dev/null || echo 0)
              if file /tmp/aosp-clang.tar.gz | grep -q 'gzip compressed' && [ "$sz" -gt 100000000 ]; then
                echo "download ok: $sz bytes (attempt $i)"
                ok=1; break
              fi
              echo "attempt $i: bad archive (size=$sz) -> retrying in $((i*10))s"
              file /tmp/aosp-clang.tar.gz || true
              sleep $((i*10))
            done
            [ "$ok" -eq 1 ] || { echo "::error::AOSP clang download failed after retries"; exit 1; }
            tar -xzf /tmp/aosp-clang.tar.gz -C "$HOME/aosp-clang"
            rm -f /tmp/aosp-clang.tar.gz
          else
            echo "clang restored from cache"
          fi
          echo "$HOME/aosp-clang/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/aosp-clang/bin:$PATH"
          clang --version | head -2
          aarch64-linux-gnu-gcc --version | head -1

      - name: Apply defconfig additions (nRF52 BLE + RTL8192EU embedded fw)
        run: |
          cd kernel
          DEFCONF=arch/arm64/configs/mido_defconfig
          test -f "$DEFCONF" || { echo "!! mido_defconfig not found"; exit 1; }
          cp "$DEFCONF" "$DEFCONF.orig"
          cat ../patch/mido-defconfig-additions.cfg >> "$DEFCONF"
          echo "---- appended block ----"
          tail -14 "$DEFCONF"

      - name: Stage RTL8192EU firmware blob into kernel tree
        run: |
          cd kernel
          mkdir -p firmware/rtlwifi
          if [ -f ../firmware/rtlwifi/rtl8192eu_nic.bin ]; then
            cp ../firmware/rtlwifi/rtl8192eu_nic.bin firmware/rtlwifi/rtl8192eu_nic.bin
            echo "Firmware staged: $(stat -c%s firmware/rtlwifi/rtl8192eu_nic.bin) bytes"
          else
            echo "::warning::rtl8192eu_nic.bin missing -> RTL8192EU fw NOT embedded (nRF52 unaffected)"
          fi

      - name: Fix TRACE_INCLUDE_PATH for GCC (header re-include by path)
        run: |
          cd kernel
          # KudProject 4.9 trace headers set TRACE_INCLUDE_PATH to '.', which
          # GCC expands (define_trace.h:88) to '#include "./<h>"' resolved
          # relative to include/trace/ -> fatal (kgsl_trace.h etc). Canonical
          # form (already used by sync_trace.h) is ../../<dir> from include/trace/.
          before=$(grep -rl '^#define[[:space:]]\+TRACE_INCLUDE_PATH[[:space:]]\+\.$' --include='*.h' . | wc -l)
          grep -rl '^#define[[:space:]]\+TRACE_INCLUDE_PATH[[:space:]]\+\.$' --include='*.h' . | while read -r f; do
            f="${f#./}"
            d="$(dirname "$f")"
            sed -i "s|^#define[[:space:]]\+TRACE_INCLUDE_PATH[[:space:]]\+\.$|#define TRACE_INCLUDE_PATH ../../$d|" "$f"
            echo "patched: $f -> ../../$d"
          done
          after=$(grep -rl '^#define[[:space:]]\+TRACE_INCLUDE_PATH[[:space:]]\+\.$' --include='*.h' . | wc -l)
          echo "broken TRACE_INCLUDE_PATH headers: $before -> $after"
          test "$after" -eq 0 || { echo "::error::unfixed TRACE_INCLUDE_PATH headers remain"; exit 1; }

      - name: Fix local angle-bracket includes for GCC (quote same-dir headers)
        run: |
          cd kernel
          # GCC resolves <X.h> only via -I include paths. msm8953 4.9 driver
          # sources include their own local headers with <> — same-dir
          # (kgsl_events.c:18 <kgsl_device.h>) AND includer-relative subdir
          # paths (usb/gadget/configfs.c:18 <function/u_ncm.h>) — while the
          # driver Makefile sets no -I for those dirs -> fatal. Quoted form
          # makes GCC search the including file's dir first (standard search
          # order), which is how every other kgsl/adreno/gadget source
          # includes local headers. Pattern allows / and . for subdir paths.
          total=0
          while IFS= read -r f; do
            d="$(dirname "$f")"
            while IFS= read -r hdr; do
              [ -f "$d/$hdr" ] || continue
              grep -q "#include <$hdr>" "$f" || continue
              sed -i "s|#include <$hdr>|#include \"$hdr\"|g" "$f"
              total=$((total+1))
              echo "quoted: $f: <$hdr> -> \"$hdr\""
            done < <(grep -oE '#include <[a-zA-Z0-9_./-]+\.h>' "$f" | sed -E 's/#include <([^>]+)>/\1/' | sort -u)
          done < <(find . -name '*.c' -type f)
          echo "same-dir angle includes quoted: $total"
          # assert the known offender is fixed (path exists in KudProject
          # trees; skip gracefully if this tree places kgsl elsewhere)
          grep -n 'include.*kgsl_device.h' drivers/gpu/msm/kgsl_events.c \
            || echo "kgsl_events.c not at expected path — assert skipped"

      - name: Fix camera_v2-legacy cross-directory includes for GCC (comprehensive)
        run: |
          cd kernel
          # GCC does NOT search the includer's directory chain for quoted
          # includes — only the including file's own dir + -I paths. The
          # legacy camera driver tree has many cross-directory #include "foo.h"
          # chains (e.g. msm_cam-legacy.h -> msm_isp.h, msm_sensor.h ->
          # msm_camera_i2c.h) that fail one-by-one under GCC.
          #
          # Fix: inject subdir-ccflags-y with the FULL union of all -I paths
          # from every Makefile in the tree, so every compilation unit inherits
          # all camera_v2-legacy include dirs. Zero duplicate basenames in the
          # tree (verified) — no shadowing risk.
          TOP_MK="drivers/media/platform/msm/camera_v2-legacy/Makefile"
          if [ ! -f "$TOP_MK" ]; then
            echo "camera_v2-legacy not present in this tree — skipping camera fix"
            exit 0
          fi

          # Fix typo: isps -> isp
          sed -i 's|camera_v2-legacy/isps"|camera_v2-legacy/isp"|g' "$TOP_MK"

          if ! grep -q 'subdir-ccflags-y' "$TOP_MK"; then
            printf '%s\n' \
              '' \
              '# GCC: inherit all camera_v2-legacy -I paths to fix cross-directory quoted includes' \
              'subdir-ccflags-y += -Idrivers/media/platform/msm/camera_v2-legacy' \
              'subdir-ccflags-y += -Idrivers/media/platform/msm/camera_v2-legacy/sensor' \
              'subdir-ccflags-y += -Idrivers/media/platform/msm/camera_v2-legacy/sensor/io' \
              'subdir-ccflags-y += -Idrivers/media/platform/msm/camera_v2-legacy/sensor/cci' \
              'subdir-ccflags-y += -Idrivers/media/platform/msm/camera_v2-legacy/common' \
              'subdir-ccflags-y += -Idrivers/media/platform/msm/camera_v2-legacy/msm_vb2' \
              'subdir-ccflags-y += -Idrivers/media/platform/msm/camera_v2-legacy/camera' \
              'subdir-ccflags-y += -Idrivers/media/platform/msm/camera_v2-legacy/codecs' \
              'subdir-ccflags-y += -Idrivers/media/platform/msm/camera_v2-legacy/isp' \
              'subdir-ccflags-y += -Idrivers/media/platform/msm/camera_v2-legacy/pproc' \
              'subdir-ccflags-y += -Idrivers/media/platform/msm/camera_v2-legacy/pproc/cpp' \
              'subdir-ccflags-y += -Idrivers/media/platform/msm/camera_v2-legacy/msm_buf_mgr' \
              'subdir-ccflags-y += -Idrivers/media/platform/msm/camera_v2-legacy/fd' \
              'subdir-ccflags-y += -Idrivers/media/platform/msm/camera_v2-legacy/jpeg_10' \
              'subdir-ccflags-y += -Idrivers/media/platform/msm/camera_v2-legacy/jpeg_dma' \
              >> "$TOP_MK"
            echo "patched: $TOP_MK (added subdir-ccflags-y with full include union)"
          fi

          # Belt-and-suspenders: also ensure isp/Makefile has its own -I
          ISP_MK="drivers/media/platform/msm/camera_v2-legacy/isp/Makefile"
          if ! grep -q 'camera_v2-legacy/isp"' "$ISP_MK"; then
            sed -i '1i ccflags-y += -Idrivers/media/platform/msm/camera_v2-legacy/isp' "$ISP_MK"
            echo "patched: $ISP_MK (added -I.../isp)"
          fi

          echo "=== top Makefile tail ==="
          tail -20 "$TOP_MK"

      - name: Neutralize AOSP-only clang --prefix (distro clang hard-errors)
        run: |
          cd kernel
          # Their Makefile appends --prefix=<toolchain>/aarch64-linux-gnu- to
          # CLANG_FLAGS — an argument ONLY AOSP-patched clang understands.
          # Stock clang (Ubuntu) errors "unknown argument", and with
          # -Werror=unknown-warning-option every cc-option probe fails ->
          # "Cannot use CONFIG_CC_STACKPROTECTOR_STRONG". --gcc-toolchain +
          # PATH already locate aarch64-linux-gnu-{as,ld}; drop --prefix.
          if grep -q 'CLANG_FLAGS.*--prefix=' Makefile; then
            sed -i 's|^\(CLANG_FLAGS[[:space:]]*+=[[:space:]]*\)--prefix=.*|# distro clang has no --prefix: \1(removed)|' Makefile
            echo "patched Makefile: --prefix removed"
          else
            echo "no --prefix line found (already clean)"
          fi
          grep -n 'CLANG_FLAGS.*prefix\|gcc-toolchain' Makefile | head -5

      - name: "Debug: instrument cc-option probes (prints exact failing command)"
        run: |
          cd kernel
          python3 - <<'PY'
          p = 'scripts/Kbuild.include'
          s = open(p).read()
          old = '__cc-option = $(call try-run,'
          new = '__cc-option = $(info CC-OPT [$(1)] CPP/CFLAGS: $(2) TEST: $(3))$(call try-run,'
          assert old in s, 'cc-option pattern not found'
          open(p, 'w').write(s.replace(old, new, 1))
          print('instrumented cc-option')
          PY

      - name: Build kernel + modules
        run: |
          cd kernel
          export ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu-
          # mido_defconfig sets CONFIG_COMPAT=y; 4.9 arch/arm64 hard-errors
          # without a 32-bit cross compiler for the compat vDSO
          export CROSS_COMPILE_ARM32=arm-linux-gnueabihf-
          # CC=clang MUST be a make ARGUMENT, not an export: their Makefile
          # hard-assigns CC=$(CROSS_COMPILE)gcc (env loses to file vars), and
          # CONFIG_LLVM_POLLY=y puts -mllvm -polly into KBUILD_CFLAGS — gcc
          # rejects -mllvm, so every cc-option probe dies and make aborts with
          # "Cannot use CONFIG_CC_STACKPROTECTOR_STRONG". Command-line args
          # override the file assignment; clang then accepts -mllvm. Their
          # build system (AndroidKernel.mk REAL_CC=...) does the same.
          MAKE="make CC=clang CLANG_TRIPLE=aarch64-linux-gnu-"
          $MAKE "$DEFCONFIG"
          # ---- final .config assertions ---------------------------------
          # olddefconfig silently drops symbols whose deps are unmet (it has
          # bitten us twice: SLIMBUS under a missing parent, RTL8XXXU_UNTESTED
          # never present). Fail here with a precise message instead of a
          # confusing vmlinux link error minutes later.
          fail=0
          for want in \
            CONFIG_SLIMBUS=y \
            CONFIG_SLIMBUS_MSM_NGD=y \
            CONFIG_BTFM_SLIM=y \
            CONFIG_BTFM_SLIM_WCN3990=y \
            '# CONFIG_CRYPTO_DEV_QCOM_ICE is not set' \
            '# CONFIG_EXT4_FS_ICE_ENCRYPTION is not set' \
            CONFIG_BT=y \
            CONFIG_BT_LE=y \
            CONFIG_BT_HCIBTUSB=y \
            CONFIG_USB_SERIAL=y \
            CONFIG_USB_ACM=y \
            CONFIG_USB_SERIAL_CH341=y \
            CONFIG_USB_SERIAL_CP210X=y \
            CONFIG_USB_SERIAL_FTDI_SIO=y \
            CONFIG_USB_SERIAL_PL2303=y \
            CONFIG_USB_CONFIGFS=y \
            CONFIG_USB_CONFIGFS_SERIAL=y \
            CONFIG_USB_CONFIGFS_ACM=y \
            CONFIG_USB_CONFIGFS_NCM=y \
            CONFIG_USB_CONFIGFS_RNDIS=y \
            CONFIG_USB_CONFIGFS_MASS_STORAGE=y \
            CONFIG_USB_CONFIGFS_F_HID=y \
            CONFIG_USB_CONFIGFS_OBEX=y \
            CONFIG_USB_CONFIGFS_ECM=y \
            CONFIG_USB_CONFIGFS_ECM_SUBSET=y \
            CONFIG_USB_CONFIGFS_EEM=y \
            CONFIG_RTL8XXXU=y \
            CONFIG_RTL8XXXU_UNTESTED=y \
            CONFIG_WLAN_VENDOR_REALTEK=y \
            CONFIG_MAC80211=y \
            'CONFIG_EXTRA_FIRMWARE="rtlwifi/rtl8192eu_nic.bin"' \
            'CONFIG_EXTRA_FIRMWARE_DIR="firmware"'
          do
            grep -qxF "$want" .config || { echo "::error::olddefconfig dropped required symbol: $want"; fail=1; }
          done
          # link-vmlinux.sh / adjust_autoksyms.sh source .config as shell
          # under set -e — any $(...) is executed as a command substitution
          # and kills the link with exit 127.
          if grep -qE '=[^#]*\$\(' .config; then
            echo "::error::shell-hostile \$(...) in final .config:"
            grep -E '=[^#]*\$\(' .config
            fail=1
          fi
          test "$fail" -eq 0 || exit 1
          # ---- end assertions -------------------------------------------
          $MAKE -j"$(nproc)" Image.gz-dtb
          $MAKE -j"$(nproc)" modules
          ls -la arch/arm64/boot/

      - name: Assemble AnyKernel3 flashable zip (NetHunter-style)
        run: |
          set -e
          AK3=AnyKernel3
          if [ ! -d "$AK3" ]; then
            curl -sL --max-time 60 -o ak3.tar.gz \
              https://github.com/osm0sis/AnyKernel3/archive/refs/heads/master.tar.gz
            tar -xzf ak3.tar.gz
            mv AnyKernel3-master "$AK3"
          fi
          rm -rf "$AK3"/Image* "$AK3"/dtb* "$AK3"/modules 2>/dev/null || true
          cp kernel/arch/arm64/boot/Image.gz-dtb "$AK3/"Image.gz-dtb
          # stock AK3 ships the osm0sis tuna (OMAP) example script: its device
          # check rejects mido and BLOCK points at an omap partition path
          cp patch/anykernel.sh "$AK3/"anykernel.sh
          # NetHunter banner
          printf 'Black-Hydra-Alphadroid | mido 4.9 NetHunter kernel (nRF52 BLE + RTL8192EU)\n' > "$AK3/banner"
          # modules -> systemless
          mkdir -p "$AK3/modules/system_root/lib/modules"
          make -C kernel ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- \
            CC=clang CLANG_TRIPLE=aarch64-linux-gnu- \
            INSTALL_MOD_PATH="$PWD/$AK3/modules/system_root" modules_install 2>/dev/null || true
          cd "$AK3"
          zip -r9 "../$ZIP_NAME" . -x '*.git*' '*/\.*'
          cd ..
          ls -la "$ZIP_NAME"

      - name: Upload kernel zip
        uses: actions/upload-artifact@v4
        with:
          name: mido-nethunter-kernel
          path: ${{ github.workspace }}/${{ env.ZIP_NAME }}
          if-no-files-found: error
