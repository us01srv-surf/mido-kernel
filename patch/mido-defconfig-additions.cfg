# NetHunter mido 4.9 additions — append to arch/arm64/configs/mido_defconfig
# (AlphaDroid-devices/kernel_xiaomi_mido @ alpha-14 — the tree this ROM boots)
#
# nRF52840 nice!nano / nRF52832 dev boards: generic Bluetooth HCI over USB.
#   The nRF52 runs its BLE stack ON-CHIP (SoftDevice) — no firmware blob, no
#   CONFIG_EXTRA_FIRMWARE. Kernel only needs a generic BT HCI transport.
#   (CONFIG_BT=y is already in the base defconfig — not repeated here to
#   avoid kconfig "override: reassigning" warnings; BT_LE is overridden
#   because the base ships "# CONFIG_BT_LE is not set".)
CONFIG_BT_LE=y
CONFIG_BT_HCIBTUSB=y
# mido BT = WCN3990 talking over SLIMbus (stock ikconfig: BTFM_SLIM=y +
# BTFM_SLIM_WCN3990=y). Earlier GCC builds forced this off (clang-only
# angle-include of a same-dir header); this kit now builds with clang and
# matches stock.
CONFIG_BTFM_SLIM=y
CONFIG_BTFM_SLIM_WCN3990=y
# FBE-path parity with stock Darkmoon ikconfig (both n there): the KudProject
# base defaulted QCOM inline-crypto-engine encryption on, and the only build
# that ever booted 21s into Android had them off while vold set up FBE keys.
# Keep ICE ext4-encryption off until proven safe on this SoC (mido = eMMC).
# CONFIG_CRYPTO_DEV_QCOM_ICE is not set
# CONFIG_EXT4_FS_ICE_ENCRYPTION is not set
# nice!nano USB = UF2 bootloader (CDC-ACM) + ZMK serial console
#   (CONFIG_USB_ACM=y is already in the base defconfig — not repeated here.)
#
# USB-UART bridge chips: ESP32-S3 works no matter which USB connection is used.
#   Native USB (USB Serial/JTAG) rides CONFIG_USB_ACM above; dev boards and
#   USB-TTL cables expose the UART through a bridge chip instead:
#     CP210x  = official Espressif DevKitC-1 / many boards
#     CH341   = cheap dev boards + USB-TTL cables (WCH)
#     FTDI    = FT232 boards/cables
#     PL2303  = Prolific USB-TTL cables
CONFIG_USB_SERIAL_CP210X=y
CONFIG_USB_SERIAL_CH341=y
CONFIG_USB_SERIAL_FTDI_SIO=y
CONFIG_USB_SERIAL_PL2303=y
#
# NetHunter 4.x gadget parity (kali.org "Configuring the 4.x Kernel - USB"):
#   base defconfig already has SERIAL/NCM/RNDIS/MASS_STORAGE/F_HID configfs
#   functions; these five are the officially-mandated ones it lacks.
CONFIG_USB_CONFIGFS_ACM=y
CONFIG_USB_CONFIGFS_OBEX=y
CONFIG_USB_CONFIGFS_ECM=y
CONFIG_USB_CONFIGFS_ECM_SUBSET=y
CONFIG_USB_CONFIGFS_EEM=y
#
# SLIMbus core — link-critical for THIS tree, not an optional feature:
#   techpack/audio/Makefile force-includes config/sdm450auto.conf for
#   CONFIG_ARCH_MSM8953, which sets WCD9XXX_CODEC_CORE/SND_SOC_CPE/
#   SND_SOC_QDSP6V2 outside Kconfig. Those objects call slim_*() from
#   drivers/slimbus/slimbus.c, while SLIMBUS itself is default-n and the
#   base defconfig only carries SLIMBUS_MSM_NGD (an `if SLIMBUS` child,
#   silently dropped while the parent is n). Without this line the vmlinux
#   link fails with 24 undefined slim_* references.
CONFIG_SLIMBUS=y
# (SLIMBUS_MSM_NGD=y is already in the base defconfig — effective once
#  the parent SLIMBUS above is enabled; restores the vendor's intent.)
#
# RTL8192EU (TP-Link TL-WN821N v5, 2357:0107): embed NIC firmware at build
#   time so the dongle hot-plugs as wlan1 without a userspace firmware loader.
#   In 4.9 rtl8xxxu the 8192e chip files build with RTL8XXXU itself, but the
#   0x2357:0107 ID lives inside #ifdef CONFIG_RTL8XXXU_UNTESTED (core.c:6178)
#   — without UNTESTED the dongle enumerates but never binds.
#   (No CONFIG_RTL8XXXU_8192E in 4.9: that symbol only exists upstream later.)
#   Two outer gates must open first, both closed by the base defconfig:
#     WLAN_VENDOR_REALTEK — rtl8xxxu/Kconfig is sourced inside `if` (realtek/
#                           Kconfig:12); base has it explicitly not-set.
#     MAC80211            — RTL8XXXU `depends on MAC80211 && USB`; base has
#                           no MAC80211 line at all (CFG80211=y alone).
CONFIG_WLAN_VENDOR_REALTEK=y
CONFIG_MAC80211=y
CONFIG_RTL8XXXU=y
CONFIG_RTL8XXXU_UNTESTED=y
CONFIG_EXTRA_FIRMWARE="rtlwifi/rtl8192eu_nic.bin"
# NOTE: plain relative path — link-vmlinux.sh/adjust_autoksyms.sh SOURCE
# .config as shell under set -e, so "$(srctree)/..." (a make expression)
# would execute srctree as a command and kill the link with exit 127.
# firmware/Makefile prefixes non-absolute paths with $(srctree) itself.
CONFIG_EXTRA_FIRMWARE_DIR="firmware"
# KernelSU: fs/exec.c, fs/open.c, fs/stat.c, fs/read_write.c and
# drivers/input/input.c call ksu_handle_* unconditionally - without a
# provider the vmlinux link dies on 5 undefined symbols (run 36445535106).
# Provider = KernelSU v0.9.5 (last non-GKI release; its documented externs
# match this tree), wired by the CI "Integrate KernelSU" step via setup.sh.
# KSU's Kconfig needs OVERLAY_FS (already =y); kprobes only feed its
# optional monitoring path (all uses are #ifdef CONFIG_KPROBES guarded).
CONFIG_KSU=y
CONFIG_KPROBES=y
