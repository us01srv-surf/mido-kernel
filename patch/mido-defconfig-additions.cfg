# NetHunter mido 4.9 additions — append to arch/arm64/configs/mido_defconfig
# (KudProject/kernel_xiaomi_msm8953-4.9 @ lineage-17.1)
#
# nRF52840 nice!nano / nRF52832 dev boards: generic Bluetooth HCI over USB.
#   The nRF52 runs its BLE stack ON-CHIP (SoftDevice) — no firmware blob, no
#   CONFIG_EXTRA_FIRMWARE. Kernel only needs a generic BT HCI transport.
CONFIG_BT=y
CONFIG_BT_LE=y
CONFIG_BT_HCIBTUSB=y
# mido BT is WCNSS/pronto over UART; the SLIMbus btfm driver only compiles
# under clang (angle-includes a same-dir header) and targets unpopulated hw
# CONFIG_BTFM_SLIM is not set
# nice!nano USB = UF2 bootloader (CDC-ACM) + ZMK serial console
CONFIG_USB_ACM=y
#
# USB-UART bridge chips: ESP32-S3 works no matter which USB connection is used.
#   Native USB (USB Serial/JTAG) rides CONFIG_USB_ACM above; dev boards and
#   USB-TTL cables expose the UART through a bridge chip instead:
#     CP210x  = official Espressif DevKitC-1 / many boards
#     CH341   = cheap dev boards + USB-TTL cables (WCH)
#     FTDI    = FT232 boards/cables
#     PL2303  = Prolific USB-TTL cables
CONFIG_USB_SERIAL_CP210X=y
CONFIG_USB_SERIAL_CH341=y
CONFIG_USB_SERIAL_FTDI_SIO=y
CONFIG_USB_SERIAL_PL2303=y
#
# NetHunter 4.x gadget parity (kali.org "Configuring the 4.x Kernel - USB"):
#   base defconfig already has SERIAL/NCM/RNDIS/MASS_STORAGE/F_HID configfs
#   functions; these five are the officially-mandated ones it lacks.
CONFIG_USB_CONFIGFS_ACM=y
CONFIG_USB_CONFIGFS_OBEX=y
CONFIG_USB_CONFIGFS_ECM=y
CONFIG_USB_CONFIGFS_ECM_SUBSET=y
CONFIG_USB_CONFIGFS_EEM=y
#
# RTL8192EU (TP-Link TL-WN821N v5, 2357:0107): embed NIC firmware at build
#   time so the dongle hot-plugs as wlan1 without a userspace firmware loader.
CONFIG_RTL8XXXU=y
CONFIG_RTL8XXXU_8192E=y
CONFIG_EXTRA_FIRMWARE="rtlwifi/rtl8192eu_nic.bin"
# NOTE: plain relative path — link-vmlinux.sh/adjust_autoksyms.sh SOURCE
# .config as shell under set -e, so "$(srctree)/..." (a make expression)
# would execute srctree as a command and kill the link with exit 127.
# firmware/Makefile prefixes non-absolute paths with $(srctree) itself.
CONFIG_EXTRA_FIRMWARE_DIR="firmware"
