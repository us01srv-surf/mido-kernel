# NetHunter mido 4.9 defconfig additions (append to arch/arm64/configs/mido_defconfig)
#
# --- nRF52840 (nice!nano dev board) BLE over USB ---
#   The nRF52 BLE stack runs ON-CHIP; the kernel only needs a generic BT HCI over
#   USB. NO firmware blob / CONFIG_EXTRA_FIRMWARE entry is required for nRF52.
CONFIG_BT=y
CONFIG_BT_LE=y
CONFIG_BT_HCIBTUSB=y
#
# --- nice!nano bootloader / USB CDC-ACM serial console ---
CONFIG_USB_ACM=y
#
# --- TP-Link TL-WN821N v5 (RTL8192EU) hotplug WiFi ---
#   In-tree rtl8xxxu drives RTL8192EU; embed the NIC blob via EXTRA_FIRMWARE so the
#   dongle enumerates instantly on hotplug (no userspace firmware loader needed).
CONFIG_RTL8XXXU=y
CONFIG_RTL8XXXU_8192E=y
CONFIG_EXTRA_FIRMWARE="rtlwifi/rtl8192eu_nic.bin"
CONFIG_EXTRA_FIRMWARE_DIR="$(srctree)/firmware"
